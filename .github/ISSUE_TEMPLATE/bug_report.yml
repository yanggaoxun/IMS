name: 🐛 Bug 报告
description: 报告一个缺陷或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，信息越具体，修复越快。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题是什么
      placeholder: 例如：登录页点击"登录"按钮后没有任何反应……
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 一步步说明如何触发这个问题
      placeholder: |
        1. 打开页面 /auth/login
        2. 输入邮箱和密码
        3. 点击"登录"
        4. 页面无响应
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正常情况下应该发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如有报错信息请完整粘贴
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 可直接拖拽图片到这里；后端报错请贴 storage/logs/laravel.log 中的相关段落
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Chrome
        - Safari
        - Edge
        - Firefox
        - 其他
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 环境信息
      description: 例如 PHP 8.3 / Node 22 / 操作系统
      placeholder: PHP 8.3, macOS 15
