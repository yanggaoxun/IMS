name: ✨ 功能请求
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 描述你遇到的痛点或使用场景，而不是直接描述解决方案
      placeholder: 例如：每次导出报表都要手动筛选日期，很繁琐……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望系统怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的备选方案
      description: 有没有其他实现方式？为什么倾向上面的方案？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接、同类产品的做法等
